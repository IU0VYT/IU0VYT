# Sito del programma (GitHub Pages): a ogni modifica del ramo main pubblica la
# cartella docs insieme a versione.txt con i conteggi dei modelli calcolati dal
# catalogo dei sorgenti (radio, impostazioni, galleria, firmware) e alle pagine
# nelle altre 12 lingue scritte da sito/genera.go.
name: Sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sito:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.7"
          cache: false
      - name: Conteggi dei modelli
        working-directory: sorgenti
        run: |
          IU0VYT_SCRIVI_CONTEGGI=1 go test -mod=vendor -count=1 -run TestConteggiVersione .
          cp ../versione.txt ../docs/versione.txt
          cat ../docs/versione.txt
      # pagine nelle altre lingue (sito/genera.go): docs/<lingua>/index.html dalle
      # traduzioni di sito/lang, link hreflang, selettore della lingua e sitemap; se
      # manca una traduzione si ferma con l'elenco dei testi e il sito resta com'era
      - name: Pagine nelle altre lingue
        working-directory: sito
        run: go run . -docs ../docs
      # versione e conteggi scritti anche nel testo delle pagine (letti dai motori
      # di ricerca senza JavaScript) e data della sitemap e dei dati strutturati
      # uguale all'ultimo commit
      - name: Versione e data nelle pagine
        run: |
          val() { sed -n "s/^$1=//p" versione.txt | tr -d '\r'; }
          pages="docs/index.html $(ls docs/*/index.html)"
          day=$(git log -1 --format=%cs)
          ver=$(val versione)
          if [ -n "$ver" ]; then
            sed -i -E "s/(class=\"[a-z -]*js-ver\">)[^<]*</\1${ver}</g; s/(\"softwareVersion\": \")[^\"]*\"/\1${ver}\"/" $pages
          fi
          for k in radio impostazioni galleria firmware marche; do
            n=$(val $k)
            if [ -n "$n" ]; then sed -i -E "s/(data-n=\"$k\">)[0-9]+</\1${n}</g" $pages; fi
          done
          sed -i -E "s/(\"dateModified\": \")[^\"]*\"/\1${day}\"/" $pages
          sed -i -E "s|<lastmod>[^<]*</lastmod>|<lastmod>${day}</lastmod>|" docs/sitemap.xml
          grep -E 'js-ver|softwareVersion|dateModified|data-n=' $pages
          cat docs/sitemap.xml
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # 4.12: avviso a Bing, Yandex, Seznam, Naver e agli altri motori che usano IndexNow
      # (https://www.indexnow.org): le 13 pagine del sito sono cambiate. La chiave è il
      # file docs/3502cec423d4a75f962bdd8c6bcef705.txt; un errore qui non ferma la pubblicazione
      - name: Avviso ai motori di ricerca (IndexNow)
        continue-on-error: true
        run: |
          base=https://iu0vyt.github.io/IU0VYT/
          urls="\"$base\""
          for l in en fr de es pt ru zh ja ko ar ms hi; do urls="$urls,\"$base$l/\""; done
          body="{\"host\":\"iu0vyt.github.io\",\"key\":\"3502cec423d4a75f962bdd8c6bcef705\",\"keyLocation\":\"${base}3502cec423d4a75f962bdd8c6bcef705.txt\",\"urlList\":[$urls]}"
          echo "$body"
          curl -sS -m 30 -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body"
